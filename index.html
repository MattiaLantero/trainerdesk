<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dr. Mattia Lantero">
<title>dr. Mattia Lantero</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --p:#014462; --a:#EB750E; --dk:#1E1E1E; --md:#AEADAD;
  --bg:#F4F6F9; --wh:#ffffff; --br:#E2E6EA;
  --pl:#e8f2f7; --al:#fdf0e6; --ok:#1a7a4a; --ol:#d4edda;
  --dn:#c0392b; --dl:#fdf2f2;
  --r:10px; --rs:7px;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Lato',sans-serif; background:var(--bg); color:var(--dk); height:100vh; overflow:hidden; display:flex; flex-direction:column; }

/* MOBILE HEADER */
#mob-hdr { display:none; align-items:center; gap:12px; padding:0 16px; height:56px; background:var(–p); flex-shrink:0; z-index:40; }
#mob-hdr button { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
.mob-name { color:#fff; font-size:15px; font-weight:700; }
.mob-name .ac { color:var(–a); }
.mob-sub { color:rgba(255,255,255,.5); font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }

/* LAYOUT */
#wrap { display:flex; flex:1; overflow:hidden; }

/* SIDEBAR */
#sb { width:248px; min-width:248px; background:var(–p); display:flex; flex-direction:column; height:100%; overflow-y:auto; transition:transform .3s; }
.sb-logo { padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.1); }
.sb-dr { font-size:13px; color:var(–a); font-weight:700; }
.sb-name { font-size:18px; font-weight:900; color:#fff; letter-spacing:-.3px; }
.sb-job { font-size:9px; color:rgba(255,255,255,.4); font-weight:700; letter-spacing:.15em; text-transform:uppercase; margin-top:3px; }
.sb-sec { font-size:9px; font-weight:700; color:rgba(255,255,255,.35); letter-spacing:.12em; padding:14px 20px 5px; text-transform:uppercase; }
.sb-btn { display:flex; align-items:center; gap:9px; padding:9px 12px; margin:2px 8px; border-radius:var(–rs); border:none; background:none; cursor:pointer; text-align:left; color:rgba(255,255,255,.7); font-size:13px; font-family:‘Lato’,sans-serif; width:calc(100% - 16px); transition:all .15s; }
.sb-btn:hover { background:rgba(255,255,255,.08); color:#fff; }
.sb-btn.on { background:var(–a); color:#fff; font-weight:700; }
.sb-btn .ic { font-size:14px; width:18px; text-align:center; flex-shrink:0; }
.sb-btn .lb { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.sb-cnt { background:rgba(255,255,255,.2); color:#fff; font-size:10px; padding:1px 6px; border-radius:10px; font-weight:700; }
.sb-add { margin:6px 16px 0; padding:9px 12px; border-radius:var(–rs); border:1.5px dashed rgba(255,255,255,.2); background:none; color:rgba(255,255,255,.4); cursor:pointer; font-size:12px; font-family:‘Lato’,sans-serif; text-align:center; transition:all .15s; }
.sb-add:hover { border-color:var(–a); color:var(–a); }
.sb-foot { margin-top:auto; padding:14px 16px; border-top:1px solid rgba(255,255,255,.1); }
.sb-bk { display:block; width:100%; padding:8px 10px; border-radius:var(–rs); border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:rgba(255,255,255,.6); cursor:pointer; font-size:11px; font-family:‘Lato’,sans-serif; font-weight:700; text-align:center; margin-bottom:5px; transition:all .15s; }
.sb-bk:hover { background:rgba(255,255,255,.12); color:#fff; }
.sb-note { font-size:9px; color:rgba(255,255,255,.25); text-align:center; letter-spacing:.08em; text-transform:uppercase; margin-top:6px; }

/* MAIN */
#main { flex:1; overflow-y:auto; }
.page { padding:28px 32px; max-width:960px; }
.ey { font-size:10px; font-weight:700; color:var(–a); letter-spacing:.15em; text-transform:uppercase; margin-bottom:5px; }
.ttl { font-size:26px; font-weight:900; letter-spacing:-.5px; margin-bottom:3px; }
.ttl .ac { color:var(–a); }
.sub { font-size:13px; color:var(–md); margin-bottom:22px; }
.ph { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px; }

/* STATS */
.stats { display:flex; gap:12px; margin-bottom:26px; flex-wrap:wrap; }
.stat { background:var(–wh); border:1px solid var(–br); border-radius:var(–r); padding:16px 20px; flex:1; min-width:105px; box-shadow:0 1px 4px rgba(1,68,98,.08); position:relative; overflow:hidden; }
.stat::before { content:’’; position:absolute; top:0; left:0; right:0; height:3px; background:var(–p); }
.stat.ac::before { background:var(–a); }
.stat.dk::before { background:var(–dk); }
.stat-i { font-size:18px; margin-bottom:7px; }
.stat-v { font-size:30px; font-weight:900; color:var(–p); line-height:1; }
.stat.ac .stat-v { color:var(–a); }
.stat.dk .stat-v { color:var(–dk); }
.stat-l { font-size:10px; color:var(–md); margin-top:3px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }

/* CARDS */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
.card { background:var(–wh); border:1px solid var(–br); border-radius:var(–r); padding:16px; cursor:pointer; transition:box-shadow .2s,transform .15s; box-shadow:0 1px 4px rgba(1,68,98,.08); position:relative; overflow:hidden; }
.card::after { content:’’; position:absolute; bottom:0; left:0; right:0; height:3px; background:var(–p); transform:scaleX(0); transition:transform .2s; }
.card:hover { box-shadow:0 4px 18px rgba(1,68,98,.13); transform:translateY(-2px); }
.card:hover::after { transform:scaleX(1); }
.card-tp { font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(–a); margin-bottom:5px; }
.card-nm { font-weight:900; font-size:15px; margin-bottom:4px; }
.card-mt { font-size:11px; color:var(–md); margin-top:2px; }

/* TABS */
.tabs { display:flex; margin-bottom:20px; border-bottom:2px solid var(–br); flex-wrap:wrap; }
.tab { padding:9px 14px; border:none; background:none; cursor:pointer; font-size:11px; font-family:‘Lato’,sans-serif; color:var(–md); border-bottom:2px solid transparent; margin-bottom:-2px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; transition:color .15s; }
.tab:hover { color:var(–dk); }
.tab.on { color:var(–p); border-bottom:2px solid var(–p); }

/* SCHEDA */
.day { background:var(–wh); border:1px solid var(–br); border-radius:var(–r); margin-bottom:10px; overflow:hidden; box-shadow:0 1px 4px rgba(1,68,98,.08); }
.day-hdr { display:flex; align-items:center; justify-content:space-between; padding:13px 16px; cursor:pointer; border-left:4px solid var(–p); user-select:none; }
.day-hdr:hover { background:#fafafa; }
.day-name { font-weight:900; font-size:14px; border:none; outline:none; background:transparent; cursor:text; font-family:‘Lato’,sans-serif; color:var(–dk); width:160px; }
.day-body { padding:8px 12px 14px; background:#f9fafc; border-top:1px solid var(–br); }

.ex { background:var(–wh); border:1px solid var(–br); border-radius:var(–rs); margin-bottom:7px; overflow:hidden; }
.ex-hdr { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; cursor:pointer; user-select:none; }
.ex-hdr:hover { background:#fafafa; }
.ex-body { padding:13px 15px; border-top:1px solid var(–br); background:#fdfdfd; }
.ex-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* CLIENT WEIGHTS */
.cw-row { display:flex; align-items:center; gap:7px; padding:7px 0; border-bottom:1px solid #f0f0f0; }
.cw-row:last-child { border-bottom:none; }
.cw-nm { font-weight:700; font-size:12px; flex:1; }
.cw-in { width:58px; padding:5px; font-size:12px; text-align:center; border:1.5px solid var(–br); border-radius:6px; font-family:‘Lato’,sans-serif; }
.cw-in:focus { border-color:var(–a); outline:none; }
.cw-u { font-size:10px; color:var(–md); font-weight:700; }

/* SESSION */
.ses-ban { background:var(–p); color:#fff; padding:14px 18px; border-radius:var(–r); margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.ses-ban h3 { font-size:15px; font-weight:900; margin-bottom:2px; }
.ses-ban p { font-size:12px; opacity:.7; }
.ses-ex { background:var(–wh); border:1px solid var(–br); border-radius:var(–r); margin-bottom:10px; overflow:hidden; box-shadow:0 1px 4px rgba(1,68,98,.08); }
.ses-exh { padding:12px 16px; border-left:4px solid var(–a); background:#fafafa; }
.ses-row { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(–br); flex-wrap:wrap; }
.ses-row:last-child { border-bottom:none; }
.ses-nm { font-weight:700; font-size:13px; flex:1; min-width:80px; }
.ses-in { width:62px; padding:6px 7px; font-size:13px; border:1.5px solid var(–br); border-radius:6px; font-family:‘Lato’,sans-serif; text-align:center; }
.ses-in:focus { border-color:var(–a); outline:none; }
.ses-u { font-size:10px; color:var(–md); font-weight:700; }
.ses-hist { background:var(–wh); border:1px solid var(–br); border-radius:var(–r); margin-bottom:8px; overflow:hidden; box-shadow:0 1px 4px rgba(1,68,98,.08); }
.ses-hist-hdr { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; cursor:pointer; border-left:4px solid var(–ok); }
.ses-hist-hdr:hover { background:#fafafa; }

/* BENCHMARKS */
.bm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-bottom:22px; }
.bm-card { background:var(–wh); border:1px solid var(–br); border-radius:var(–r); padding:16px; box-shadow:0 1px 4px rgba(1,68,98,.08); }
.bm-nm { font-weight:700; font-size:13px; margin-bottom:3px; }
.bm-val { font-size:28px; font-weight:900; color:var(–p); line-height:1; }
.bm-card.hd .bm-val { color:var(–a); }
.bm-u { font-size:11px; color:var(–md); font-weight:700; margin-left:3px; }
.bm-dt { font-size:11px; color:var(–md); margin-top:3px; }
.bm-tr { font-size:12px; font-weight:700; margin-top:4px; }
.tr-up { color:var(–ok); } .tr-dn { color:var(–dn); }

/* TEMPLATES */
.tpl { background:var(–wh); border:1px solid var(–br); border-radius:var(–r); margin-bottom:10px; overflow:hidden; box-shadow:0 1px 4px rgba(1,68,98,.08); }
.tpl-hdr { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; cursor:pointer; border-left:4px solid var(–a); }
.tpl-hdr:hover { background:#fafafa; }

/* FORMS */
.fl { font-size:10px; font-weight:700; color:var(–md); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
input[type=text], input[type=number], input[type=date], select, textarea {
width:100%; padding:8px 10px; border:1.5px solid var(–br); border-radius:var(–rs);
font-size:13px; font-family:‘Lato’,sans-serif; outline:none; background:var(–wh); color:var(–dk); transition:border-color .15s;
}
input:focus, select:focus, textarea:focus { border-color:var(–p); box-shadow:0 0 0 3px rgba(1,68,98,.07); }
textarea { resize:vertical; min-height:54px; }

/* BUTTONS */
.btn { padding:9px 18px; border-radius:var(–rs); border:none; cursor:pointer; font-size:13px; font-family:‘Lato’,sans-serif; font-weight:700; transition:all .15s; }
.btn:active { transform:scale(.97); }
.btn-p { background:var(–p); color:#fff; } .btn-p:hover { background:#013652; }
.btn-a { background:var(–a); color:#fff; } .btn-a:hover { background:#d4690c; }
.btn-g { background:transparent; color:var(–md); border:1.5px solid var(–br); }
.btn-d { background:var(–dl); color:var(–dn); border:1px solid #f5c6c6; font-size:12px; padding:7px 13px; }
.btn-add { background:var(–pl); color:var(–p); border:1.5px dashed #a8c8d8; padding:9px 14px; border-radius:var(–rs); cursor:pointer; font-size:11px; font-weight:700; font-family:‘Lato’,sans-serif; letter-spacing:.03em; text-transform:uppercase; transition:all .15s; }
.btn-add:hover { background:#d0e8f2; border-color:var(–p); }
.btn-i { padding:5px 9px; background:var(–pl); color:var(–p); border:none; border-radius:6px; cursor:pointer; font-size:13px; }
.btn-ia { padding:5px 9px; background:var(–al); color:var(–a); border:none; border-radius:6px; cursor:pointer; font-size:13px; }
.btn-id { padding:5px 9px; background:var(–dl); color:var(–dn); border:none; border-radius:6px; cursor:pointer; font-size:13px; }

/* BADGES */
.bdg { font-size:10px; background:var(–pl); color:var(–p); padding:2px 8px; border-radius:20px; font-weight:700; white-space:nowrap; }
.bdg-a { background:var(–al); color:var(–a); }
.bdg-ok { background:var(–ol); color:var(–ok); }
.bdg-m { background:#f0f0f0; color:var(–md); }

/* DOTS */
.dot { display:inline-block; width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.d-forza { background:var(–p); } .d-cardio { background:var(–a); } .d-mobilita { background:#1a7a4a; }
.d-ipertrofia { background:#6c3483; } .d-potenza { background:#c0392b; } .d-core { background:var(–md); } .d-stretching { background:#17a589; }

/* TYPE BTNS */
.tbtn { padding:8px 14px; border:1.5px solid var(–br); border-radius:var(–rs); cursor:pointer; background:var(–wh); font-size:12px; font-family:‘Lato’,sans-serif; font-weight:700; transition:all .15s; }
.tbtn.on { border-color:var(–p); background:var(–pl); color:var(–p); }

/* MODAL */
.ov { position:fixed; inset:0; background:rgba(1,68,98,.4); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; backdrop-filter:blur(3px); }
.modal { background:var(–wh); border-radius:14px; padding:26px; width:100%; max-width:500px; box-shadow:0 16px 48px rgba(1,68,98,.18); max-height:92vh; overflow-y:auto; }
.modal-t { font-size:17px; font-weight:900; margin-bottom:18px; }
.modal-t .ac { color:var(–a); }
.modal-a { display:flex; gap:8px; margin-top:18px; }

/* DIVIDER */
.dv { display:flex; align-items:center; gap:10px; margin:16px 0 12px; }
.dv span { font-size:10px; font-weight:700; color:var(–md); text-transform:uppercase; letter-spacing:.1em; white-space:nowrap; }
.dv::before, .dv::after { content:’’; flex:1; height:1px; background:var(–br); }

/* TOAST */
#toast { position:fixed; bottom:22px; right:22px; padding:11px 18px; border-radius:var(–r); color:#fff; font-weight:700; font-size:13px; z-index:200; box-shadow:0 4px 18px rgba(1,68,98,.13); display:none; animation:up .3s ease; }
@keyframes up { from { transform:translateY(16px); opacity:0; } to { transform:translateY(0); opacity:1; } }

.empty { color:var(–md); font-size:13px; padding:38px 0; text-align:center; }
.empty i { font-size:30px; display:block; margin-bottom:10px; font-style:normal; }
.info { padding:11px 14px; background:var(–pl); border-radius:var(–rs); border-left:3px solid var(–p); font-size:12px; color:var(–p); margin-top:10px; }
.info-a { background:var(–al); border-left-color:var(–a); color:#7a3a05; }
.log-row { display:flex; gap:8px; align-items:center; font-size:12px; padding:4px 0; border-bottom:1px solid #f5f5f5; flex-wrap:wrap; }
.log-row:last-child { border-bottom:none; }
.ii { padding:6px 10px; border:1.5px solid var(–br); border-radius:var(–rs); font-size:19px; font-weight:900; font-family:‘Lato’,sans-serif; outline:none; }
.ii:focus { border-color:var(–p); }

/* MOBILE */
#mob-ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:49; }
#mob-ov.open { display:block; }
@media(max-width:768px) {
#mob-hdr { display:flex; }
#sb { position:fixed; left:0; top:56px; height:calc(100vh - 56px); z-index:50; transform:translateX(-100%); }
#sb.open { transform:translateX(0); box-shadow:0 16px 48px rgba(1,68,98,.18); }
.page { padding:16px 14px; }
.ttl { font-size:21px; }
.stats { gap:8px; }
.stat { padding:12px 14px; }
.stat-v { font-size:26px; }
.ex-grid { grid-template-columns:1fr; }
.grid { grid-template-columns:1fr 1fr; }
.ses-in { width:55px; }
.bm-grid { grid-template-columns:1fr 1fr; }
}
@media(max-width:400px) { .grid { grid-template-columns:1fr; } .bm-grid { grid-template-columns:1fr; } }
::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:#d0d0d0; border-radius:3px; }
</style>

</head>
<body>
<div id="mob-ov" onclick="closeSB()"></div>

<div id="mob-hdr">
  <button onclick="toggleSB()">☰</button>
  <div><div class="mob-name"><span class="ac">dr.</span> Mattia Lantero</div><div class="mob-sub">Chinesiologo</div></div>
</div>

<div id="wrap">
<aside id="sb">
  <div class="sb-logo">
    <div class="sb-dr">dr.</div>
    <div class="sb-name">Mattia Lantero</div>
    <div class="sb-job">Chinesiologo</div>
  </div>
  <nav style="flex:1;display:flex;flex-direction:column">
    <button class="sb-btn on" id="nb-dash" onclick="goDash()"><span class="ic">🏠</span><span class="lb">Dashboard</span></button>
    <div class="sb-sec">Clienti</div>
    <button class="sb-btn" id="nb-cli" onclick="goCli()"><span class="ic">👤</span><span class="lb">Archivio Clienti</span></button>
    <div class="sb-sec">Gruppi</div>
    <div id="nb-grp"></div>
    <button class="sb-add" onclick="openModal('grp')">+ Nuovo gruppo</button>
    <div class="sb-sec">Libreria</div>
    <button class="sb-btn" id="nb-tpl" onclick="goTpl()"><span class="ic">📦</span><span class="lb">Template</span></button>
  </nav>
  <div class="sb-foot">
    <div class="sb-sec" style="padding:0 0 7px">Backup</div>
    <button class="sb-bk" onclick="expD()">📤 Esporta dati</button>
    <label class="sb-bk" style="cursor:pointer">📥 Importa dati<input type="file" accept=".json" style="display:none" onchange="impD(event)"></label>
    <div class="sb-note">Salvataggio automatico</div>
  </div>
</aside>

<div id="main"><div id="cnt"></div></div>
</div>

<div class="ov" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-box"></div>
</div>
<div id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────
var SK = 'dml_v8';
var S = (function() {
  try { var r = localStorage.getItem(SK); return r ? JSON.parse(r) : {groups:[],clients:[],templates:[]}; }
  catch(e) { return {groups:[],clients:[],templates:[]}; }
})();
var VIEW = 'dash', GID = null, TAB = 'scheda';
var OPEN_DAYS = {}, OPEN_EXS = {};

function save() { try { localStorage.setItem(SK, JSON.stringify(S)); } catch(e) {} }
function uid() { return Math.random().toString(36).slice(2,9); }
function today() { return new Date().toISOString().slice(0,10); }
function fd(d) { return d ? new Date(d+'T12:00:00').toLocaleDateString('it-IT') : '—'; }
function G() { return S.groups.filter(function(g){ return g.id===GID; })[0]; }
function h(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tL(t) { return {group:'Small Group',single:'Singolo',couple:'Coppia'}[t]||t; }
function catCls(c) { return {forza:'d-forza',cardio:'d-cardio','mobilità':'d-mobilita',ipertrofia:'d-ipertrofia',potenza:'d-potenza',core:'d-core',stretching:'d-stretching'}[c]||'d-forza'; }
function gCli() { var g=G(); if(!g) return []; return (g.clients||[]).map(function(id){ return (S.clients||[]).filter(function(c){return c.id===id;})[0]; }).filter(Boolean); }
function set(html) { document.getElementById('cnt').innerHTML = html; }

// Toast
var TT;
function toast(msg,col) { var t=document.getElementById('toast'); t.textContent=msg; t.style.background=col||'#014462'; t.style.display='block'; clearTimeout(TT); TT=setTimeout(function(){t.style.display='none';},2800); }

// Sidebar
function rNav() {
  document.getElementById('nb-grp').innerHTML = S.groups.map(function(g) {
    var on = GID===g.id && VIEW==='grp';
    var ic = g.type==='group'?'👥':g.type==='couple'?'👫':'👤';
    return '<button class="sb-btn'+(on?' on':'')+'" onclick="goGrp(\''+g.id+'\')"><span class="ic">'+ic+'</span><span class="lb">'+h(g.name)+'</span>'+(g.clients&&g.clients.length?'<span class="sb-cnt">'+g.clients.length+'</span>':'')+'</button>';
  }).join('');
  ['dash','cli','tpl'].forEach(function(k) {
    var el = document.getElementById('nb-'+k);
    if(el) el.className = 'sb-btn'+(VIEW===k?' on':'');
  });
}
function toggleSB() { document.getElementById('sb').classList.toggle('open'); document.getElementById('mob-ov').classList.toggle('open'); }

// ── CHART ──────────────────────────────────────────────────────────────
function chart(pts,color,W,H) {
  W=W||220; H=H||60;
  var vals = pts.filter(function(p){return !isNaN(p.v);});
  if(vals.length<2) return '';
  var maxY=Math.max.apply(null,vals.map(function(p){return p.v;}));
  var minY=Math.min.apply(null,vals.map(function(p){return p.v;}));
  var pad=8;
  function px(i){return pad+(i/(vals.length-1))*(W-2*pad);}
  function py(v){return H-pad-((v-minY)/((maxY-minY)||1))*(H-2*pad);}
  var pts2=vals.map(function(p,i){return px(i)+','+py(p.v);}).join(' ');
  var area=px(vals.length-1)+','+(H-pad)+' '+px(0)+','+(H-pad);
  var gid='g'+uid();
  return '<div style="margin-bottom:8px"><svg width="'+W+'" height="'+H+'" style="display:block;overflow:visible">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.15"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +'<polygon fill="url(#'+gid+')" points="'+pts2+' '+area+'"/>'
    +'<polyline fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" points="'+pts2+'"/>'
    +vals.map(function(p,i){return '<circle cx="'+px(i)+'" cy="'+py(p.v)+'" r="3.5" fill="'+color+'" stroke="white" stroke-width="1.5"/>';}).join('')
    +'</svg><div style="display:flex;justify-content:space-between;font-size:10px;color:#bbb;margin-top:2px"><span>'+h(vals[0].date)+'</span><span style="font-weight:700;color:'+color+'">'+vals[vals.length-1].v+'</span><span>'+h(vals[vals.length-1].date)+'</span></div></div>';
}
