<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="dr. Mattia Lantero">
<title>dr. Mattia Lantero</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --p:#014462;--a:#EB750E;--dk:#1E1E1E;--md:#AEADAD;
  --bg:#F4F6F9;--wh:#fff;--br:#E2E6EA;
  --pl:#e8f2f7;--al:#fdf0e6;--dn:#c0392b;--dl:#fdf2f2;
  --ok:#1a7a4a;--ol:#d4edda;
  --r:10px;--rs:7px;
  --s1:0 1px 4px rgba(1,68,98,.08);
  --s2:0 4px 18px rgba(1,68,98,.13);
  --s3:0 16px 48px rgba(1,68,98,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Lato',sans-serif;background:var(--bg);color:var(--dk);height:100vh;overflow:hidden;display:flex;flex-direction:column}
#mh{display:none;align-items:center;gap:12px;padding:0 16px;height:56px;background:var(--p);flex-shrink:0;z-index:40}
#mt{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px}
.mlt{color:#fff;font-size:15px;font-weight:700}
.mls{color:rgba(255,255,255,.5);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
#bw{display:flex;flex:1;overflow:hidden}
#sb{width:248px;min-width:248px;background:var(--p);display:flex;flex-direction:column;height:100%;overflow-y:auto;transition:transform .3s ease}
.slogo{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sdr{font-size:13px;color:var(--a);font-weight:700}
.snm{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.3px;line-height:1.1}
.ssb{font-size:9px;color:rgba(255,255,255,.4);font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-top:3px}
.ns{font-size:9px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.12em;padding:14px 20px 5px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:9px;padding:9px 12px;margin:2px 8px;border-radius:var(--rs);border:none;background:none;cursor:pointer;text-align:left;color:rgba(255,255,255,.7);font-size:13px;font-family:'Lato',sans-serif;font-weight:400;width:calc(100% - 16px);transition:all .15s}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}
.ni.active{background:var(--a);color:#fff;font-weight:700}
.ni .ic{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.ni .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ni .nb{background:rgba(255,255,255,.2);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
.ni.active .nb{background:rgba(255,255,255,.3)}
.ab{margin:6px 16px 0;padding:9px 12px;border-radius:var(--rs);border:1.5px dashed rgba(255,255,255,.2);background:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:12px;font-family:'Lato',sans-serif;text-align:center;transition:all .15s}
.ab:hover{border-color:var(--a);color:var(--a)}
.sfooter{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.1)}
.bb{display:block;width:100%;padding:8px 10px;border-radius:var(--rs);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);cursor:pointer;font-size:11px;font-family:'Lato',sans-serif;font-weight:700;text-align:center;margin-bottom:5px;transition:all .15s}
.bb:hover{background:rgba(255,255,255,.12);color:#fff}
.bbl{font-size:9px;color:rgba(255,255,255,.25);text-align:center;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
#main{flex:1;overflow-y:auto;background:var(--bg)}
.page{padding:28px 32px;max-width:960px}
.eyebrow{font-size:10px;font-weight:700;color:var(--a);letter-spacing:.15em;text-transform:uppercase;margin-bottom:5px}
.pt{font-size:26px;font-weight:900;letter-spacing:-.5px;color:var(--dk);margin-bottom:3px}
.pt .ac{color:var(--a)}
.ps{font-size:13px;color:var(--md);margin-bottom:22px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.sr{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap}
.sc{background:var(--wh);border:1px solid var(--br);border-radius:var(--r);padding:16px 20px;flex:1;min-width:105px;box-shadow:var(--s1);position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--p)}
.sc.o::before{background:var(--a)}.sc.d::before{background:var(--dk)}
.sic{font-size:18px;margin-bottom:7px}
.sv{font-size:30px;font-weight:900;color:var(--p);line-height:1}
.sc.o .sv{color:var(--a)}.sc.d .sv{color:var(--dk)}
.slb{font-size:10px;color:var(--md);margin-top:3px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px}
.gc{background:var(--wh);border:1px solid var(--br);border-radius:var(--r);padding:16px;cursor:pointer;transition:box-shadow .2s,transform .15s;box-shadow:var(--s1);position:relative;overflow:hidden}
.gc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--p);transform:scaleX(0);transition:transform .2s}
.gc:hover{box-shadow:var(--s2);transform:translateY(-2px)}.gc:hover::after{transform:scaleX(1)}
.gct{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a);margin-bottom:5px}
.gcn{font-weight:900;font-size:15px;margin-bottom:4px;color:var(--dk)}
.gcm{font-size:11px;color:var(--md);margin-top:2px}
.tabs{display:flex;margin-bottom:20px;border-bottom:2px solid var(--br);flex-wrap:wrap}
.tab{padding:9px 14px;border:none;background:none;cursor:pointer;font-size:11px;font-family:'Lato',sans-serif;color:var(--md);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;transition:color .15s}
.tab:hover{color:var(--dk)}.tab.active{color:var(--p);border-bottom:2px solid var(--p)}
.db{background:var(--wh);border:1px solid var(--br);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--s1)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;user-select:none;border-left:4px solid var(--p)}
.dh:hover{background:#fafafa}
.dni{font-weight:900;font-size:14px;border:none;outline:none;background:transparent;cursor:text;font-family:'Lato',sans-serif;color:var(--dk);width:160px}
.dy{padding:8px 12px 14px;background:#f9fafc;border-top:1px solid var(--br)}
.eb{background:var(--wh);border:1px solid var(--br);border-radius:var(--rs);margin-bottom:7px;overflow:hidden}
.eh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;user-select:none}
.eh:hover{background:#fafafa}
.ebody{padding:13px 15px;border-top:1px solid var(--br);background:#fdfdfd}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eg .s2{grid-column:1/-1}
.sban{background:var(--p);color:#fff;padding:14px 18px;border-radius:var(--r);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.sban h3{font-size:15px;font-weight:900;margin-bottom:2px}
.sban p{font-size:12px;opacity:.7}
.sex{background:var(--wh);border:1px solid var(--br);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--s1)}
.sexh{padding:12px 16px;border-left:4px solid var(--a);background:#fafafa}
.sext{font-weight:900;font-size:14px;color:var(--dk)}
.sexm{font-size:12px;color:var(--md);margin-top:2px}
.scr{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--br)}
.scr:last-child{border-bottom:none}
.scn{font-weight:700;font-size:13px;flex:1}
.sins{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sins input{width:62px;padding:6px 7px;font-size:13px;border:1.5px solid var(--br);border-radius:6px;font-family:'Lato',sans-serif;text-align:center}
.sins input:focus{border-color:var(--a);outline:none}
.sunit{font-size:10px;color:var(--md);font-weight:700}
.bmg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:22px}
.bmc{background:var(--wh);border:1px solid var(--br);border-radius:var(--r);padding:16px;box-shadow:var(--s1)}
.bmn{font-weight:700;font-size:13px;color:var(--dk);margin-bottom:3px}
.bmv{font-size:28px;font-weight:900;color:var(--p);line-height:1}
.bmc.hd .bmv{color:var(--a)}
.bmu{font-size:11px;color:var(--md);font-weight:700;margin-left:3px}
.bmd{font-size:11px;color:var(--md);margin-top:3px}
.bmt{font-size:12px;font-weight:700;margin-top:4px}
.tup{color:var(--ok)}.tdn{color:var(--dn)}
.shc{background:var(--wh);border:1px solid var(--br);border-radius:var(--r);margin-bottom:8px;overflow:hidden;box-shadow:var(--s1)}
.shh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;border-left:4px solid var(--ok)}
.shh:hover{background:#fafafa}
.tblk{background:var(--wh);border:1px solid var(--br);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--s1)}
.tbh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;border-left:4px solid var(--a)}
.tbh:hover{background:#fafafa}
.fl{font-size:10px;font-weight:700;color:var(--md);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--br);border-radius:var(--rs);font-size:13px;font-family:'Lato',sans-serif;outline:none;background:var(--wh);color:var(--dk);transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(1,68,98,.07)}
.btn{padding:9px 18px;border-radius:var(--rs);border:none;cursor:pointer;font-size:13px;font-family:'Lato',sans-serif;font-weight:700;transition:all .15s;letter-spacing:.02em}
.btn:active{transform:scale(.97)}
.bp{background:var(--p);color:#fff}.bp:hover{background:#013652}
.ba{background:var(--a);color:#fff}.ba:hover{background:#d4690c}
.bg{background:transparent;color:var(--md);border:1.5px solid var(--br)}
.bd{background:var(--dl);color:var(--dn);border:1px solid #f5c6c6;font-size:12px;padding:7px 13px}
.badd{background:var(--pl);color:var(--p);border:1.5px dashed #a8c8d8;padding:9px 14px;border-radius:var(--rs);cursor:pointer;font-size:11px;font-weight:700;font-family:'Lato',sans-serif;letter-spacing:.03em;text-transform:uppercase;transition:all .15s}
.badd:hover{background:#d0e8f2;border-color:var(--p)}
.bi{padding:5px 9px;background:var(--pl);color:var(--p);border:none;border-radius:6px;cursor:pointer;font-size:13px}
.bia{padding:5px 9px;background:var(--al);color:var(--a);border:none;border-radius:6px;cursor:pointer;font-size:13px}
.bid{padding:5px 9px;background:var(--dl);color:var(--dn);border:none;border-radius:6px;cursor:pointer;font-size:13px}
.badge{font-size:10px;background:var(--pl);color:var(--p);padding:2px 8px;border-radius:20px;font-weight:700;white-space:nowrap}
.bo{background:var(--al);color:var(--a)}
.bs{background:var(--ol);color:var(--ok)}
.bm{background:#f0f0f0;color:var(--md)}
.cd{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cf{background:var(--p)}.cc{background:var(--a)}.cm{background:#1a7a4a}
.ci{background:#6c3483}.cp{background:#c0392b}.co{background:var(--md)}.csr{background:#17a589}
.tb{padding:8px 14px;border:1.5px solid var(--br);border-radius:var(--rs);cursor:pointer;background:var(--wh);font-size:12px;font-family:'Lato',sans-serif;font-weight:700;transition:all .15s}
.tb.active{border-color:var(--p);background:var(--pl);color:var(--p)}
.ov{position:fixed;inset:0;background:rgba(1,68,98,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(3px)}
.mb{background:var(--wh);border-radius:14px;padding:26px;width:100%;max-width:500px;box-shadow:var(--s3);max-height:92vh;overflow-y:auto}
.mtitle{font-size:17px;font-weight:900;margin-bottom:18px;color:var(--dk)}
.mtitle .ac{color:var(--a)}
.ma{display:flex;gap:8px;margin-top:18px}
.dv{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.dv span{font-size:10px;font-weight:700;color:var(--md);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.dv::before,.dv::after{content:'';flex:1;height:1px;background:var(--br)}
#toast{position:fixed;bottom:22px;right:22px;padding:11px 18px;border-radius:var(--r);color:#fff;font-weight:700;font-size:13px;z-index:200;box-shadow:var(--s2);display:none;animation:su .3s ease}
@keyframes su{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty{color:var(--md);font-size:13px;padding:38px 0;text-align:center}
.empty i{font-size:30px;display:block;margin-bottom:10px;font-style:normal}
.info{padding:11px 14px;background:var(--pl);border-radius:var(--rs);border-left:3px solid var(--p);font-size:12px;color:var(--p);margin-top:10px}
.info-o{background:var(--al);border-left-color:var(--a);color:#7a3a05}
.ii{padding:6px 10px;border:1.5px solid var(--br);border-radius:var(--rs);font-size:19px;font-weight:900;font-family:'Lato',sans-serif;outline:none}
.ii:focus{border-color:var(--p)}
.lr{display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid #f5f5f5;flex-wrap:wrap}
.lr:last-child{border-bottom:none}
.cw{margin-bottom:8px}
.cl-lbl{font-size:10px;font-weight:700;color:var(--md);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
#mob-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49}
#mob-ov.open{display:block}
@media(max-width:768px){
  #mh{display:flex}
  #sb{position:fixed;left:0;top:56px;height:calc(100vh - 56px);z-index:50;transform:translateX(-100%)}
  #sb.open{transform:translateX(0);box-shadow:var(--s3)}
  .page{padding:16px 14px}.pt{font-size:21px}
  .sr{gap:8px}.sc{padding:12px 14px}.sv{font-size:26px}
  .eg{grid-template-columns:1fr}.eg .s2{grid-column:1}
  .cg{grid-template-columns:1fr 1fr}
  .sins input{width:55px}
  .bmg{grid-template-columns:1fr 1fr}
}
@media(max-width:400px){.cg{grid-template-columns:1fr}.bmg{grid-template-columns:1fr}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d0d0d0;border-radius:3px}
</style>
</head>
<body>
<div id="mob-ov" onclick="closeSB()"></div>
<div id="mh">
  <button id="mt" onclick="toggleSB()">☰</button>
  <div><div class="mlt"><span style="color:#EB750E">dr.</span> Mattia Lantero</div><div class="mls">Chinesiologo</div></div>
</div>
<div id="bw">
<aside id="sb">
  <div class="slogo"><div class="sdr">dr.</div><div class="snm">Mattia Lantero</div><div class="ssb">Chinesiologo</div></div>
  <nav style="flex:1;display:flex;flex-direction:column">
    <button class="ni active" id="n-dash" onclick="vDash()"><span class="ic">🏠</span><span class="lb">Dashboard</span></button>
    <div class="ns">Clienti</div>
    <button class="ni" id="n-cli" onclick="vCli()"><span class="ic">👤</span><span class="lb">Archivio Clienti</span></button>
    <div class="ns">Gruppi & Sessioni</div>
    <div id="n-grp"></div>
    <button class="ab" onclick="oModal('ng')">+ Nuovo gruppo</button>
    <div class="ns">Libreria</div>
    <button class="ni" id="n-tpl" onclick="vTpl()"><span class="ic">📦</span><span class="lb">Blocchi Template</span></button>
  </nav>
  <div class="sfooter">
    <div class="ns" style="padding:0 0 7px">Backup</div>
    <button class="bb" onclick="expD()">📤 Esporta dati</button>
    <label class="bb" style="cursor:pointer">📥 Importa dati<input type="file" accept=".json" style="display:none" onchange="impD(event)"></label>
    <div class="bbl">Salvataggio automatico attivo</div>
  </div>
</aside>
<div id="main"><div id="cnt"></div></div>
</div>
<div class="ov" id="modal" style="display:none" onclick="cmo(event)"><div class="mb" id="mb"></div></div>
<div id="toast"></div>

<script>
const SK='dml_v6';
let S=lS();
let CV='dash',CG=null,CT='scheda';
let xD=new Set(),xE=new Set();

function lS(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{groups:[],clients:[],templates:[]}}catch{return{groups:[],clients:[],templates:[]}}}
function sS(){try{localStorage.setItem(SK,JSON.stringify(S))}catch{}}
const uid=()=>Math.random().toString(36).slice(2,9);
const td=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?new Date(d+'T12:00:00').toLocaleDateString('it-IT'):'—';
const G=()=>S.groups.find(g=>g.id===CG);
const c2c=c=>({forza:'cf',cardio:'cc','mobilità':'cm',ipertrofia:'ci',potenza:'cp',core:'co',stretching:'csr'}[c]||'cf');
const tL=t=>({group:'Small Group',single:'Singolo',couple:'Coppia'}[t]||t);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const set=h=>document.getElementById('cnt').innerHTML=h;

const BMS=[
  {id:'stacco',name:'Massimale Stacco',unit:'kg',icon:'🏋️',hb:true},
  {id:'panca',name:'Massimale Panca Piana',unit:'kg',icon:'💪',hb:true},
  {id:'trazioni',name:'Trazioni corpo libero',unit:'reps',icon:'🔝',hb:true},
  {id:'vog2k',name:'Vogatore 2km',unit:'min:sec',icon:'🚣',hb:false},
  {id:'vog1k',name:'Vogatore 1km',unit:'min:sec',icon:'🚣',hb:false},
  {id:'ecobike',name:'Watt max Ecobike',unit:'W',icon:'🚴',hb:true},
];

let TT;
function toast(msg,col='#014462'){const t=document.getElementById('toast');t.textContent=msg;t.style.background=col;t.style.display='block';clearTimeout(TT);TT=setTimeout(()=>t.style.display='none',2800)}

function rNav(){
  document.getElementById('n-grp').innerHTML=S.groups.map(g=>`
    <button class="ni ${CG===g.id&&CV==='group'?'active':''}" onclick="vGroup('${g.id}')">
      <span class="ic">${g.type==='group'?'👥':g.type==='couple'?'👫':'👤'}</span>
      <span class="lb">${esc(g.name)}</span>
      ${g.clients?.length?`<span class="nb">${g.clients.length}</span>`:''}
    </button>`).join('');
  ['dash','cli','tpl'].forEach(k=>{const el=document.getElementById('n-'+k);if(el)el.className='ni'+(CV===k?' active':'')});
}
function toggleSB(){document.getElementById('sb').classList.toggle('open');document.getElementById('mob-ov').classList.toggle('open')}
function closeSB(){document.getElementById('sb').classList.remove('open');document.getElementById('mob-ov').classList.remove('open')}

// DASHBOARD
function vDash(){CV='dash';CG=null;rNav();closeSB();
  const tot=S.groups.reduce((s,g)=>s+(g.sessions?.length||0),0);
  set(`<div class="page">
    <div class="eyebrow">Pannello di controllo</div>
    <h1 class="pt"><span class="ac">dr.</span> Mattia Lantero</h1>
    <div class="ps">Gestione schede allenamento — Chinesiologo</div>
    <div class="sr">
      <div class="sc"><div class="sic">👥</div><div class="sv">${S.groups.length}</div><div class="slb">Gruppi</div></div>
      <div class="sc o"><div class="sic">👤</div><div class="sv">${(S.clients||[]).length}</div><div class="slb">Clienti</div></div>
      <div class="sc d"><div class="sic">⚡</div><div class="sv">${tot}</div><div class="slb">Sessioni</div></div>
    </div>
    ${S.groups.length===0?`<div class="empty"><i>💪</i>Nessun gruppo ancora.<br>Clicca <strong>"+ Nuovo gruppo"</strong>!</div>`:`
    <div class="dv"><span>Gruppi attivi</span></div>
    <div class="cg">${S.groups.map(g=>{
      const cls=(S.clients||[]).filter(c=>g.clients?.includes(c.id));
      const ls=g.sessions?.slice(-1)[0];
      return`<div class="gc" onclick="vGroup('${g.id}')">
        <div class="gct">${tL(g.type)}</div>
        <div class="gcn">${esc(g.name)}</div>

// CLIENT PROFILE
function vClient(cid){
  CV='client';CG=null;rNav();closeSB();
  const c=(S.clients||[]).find(x=>x.id===cid);if(!c)return;
  const gs=S.groups.filter(g=>g.clients?.includes(cid));
  const bm=c.benchmarks||{};
  const cards=BMS.map(b=>{
    const logs=bm[b.id]||[];
    const last=logs[logs.length-1],prev=logs[logs.length-2];
    let trend='';
    if(last&&prev){
      const v1=parseFloat(String(last.v).replace(':','.'));
      const v2=parseFloat(String(prev.v).replace(':','.'));
      const better=b.hb?(v1>v2):(v1<v2);
      trend=`<div class="bmt ${better?'tup':'tdn'}">${better?'↑ Migliorato':'↓ Peggiorato'}</div>`;
    }
    const cd=logs.map(l=>{let v=String(l.v);if(v.includes(':')){const p=v.split(':');v=String(parseInt(p[0])*60+parseInt(p[1]||0))}return{date:l.date,value:parseFloat(v)||0}});
    return`<div class="bmc ${last?'hd':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div class="bmn">${b.icon} ${b.name}</div>
        <button class="bia" style="font-size:11px;padding:4px 8px" onclick="oBmM('${cid}','${b.id}')">+ Log</button>
      </div>
      ${last?`<div><span class="bmv">${esc(String(last.v))}</span><span class="bmu">${b.unit}</span></div>
      <div class="bmd">${fd(last.date)}</div>${trend}
      ${cd.length>=2?rChart(cd,220,60,'#014462'):''}
      `:`<div style="color:var(--md);font-size:12px;margin-top:6px">Nessun dato ancora</div>`}
    </div>`}).join('');
  set(`<div class="page">
    <div class="eyebrow">Profilo Cliente</div>
    <div class="ph">
      <div><h1 class="pt">${esc(c.name)}</h1>
        <div class="ps">Dal ${fd(c.joinDate)}${gs.length?' · '+gs.map(g=>esc(g.name)).join(', '):''}</div>
      </div>
      <button class="btn bd" onclick="delCli('${cid}')">🗑 Elimina</button>
    </div>
    <div class="dv"><span>Benchmark fondamentali</span></div>
    <div class="bmg">${cards}</div>
  </div>`)}

function oBmM(cid,bid){
  const b=BMS.find(x=>x.id===bid);
  document.getElementById('mb').innerHTML=`
    <div class="mtitle">📊 <span class="ac">${b.name}</span></div>
    <div class="fl">Valore (${b.unit})</div>
    <input type="text" id="bv" placeholder="${b.unit==='min:sec'?'es. 7:30':b.unit==='reps'?'es. 12':'es. 100'}" style="margin-bottom:12px">
    <div class="fl">Data</div>
    <input type="date" id="bd" value="${td()}" style="margin-bottom:4px">
    <div class="ma"><button class="btn bp" onclick="saveBm('${cid}','${bid}')">Salva</button><button class="btn bg" onclick="cm()">Annulla</button></div>`;
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>document.getElementById('bv').focus(),100);
}
function saveBm(cid,bid){
  const val=document.getElementById('bv').value.trim();const date=document.getElementById('bd').value;

  const c=(S.clients||[]).find(x=>x.id===cid);
  c.benchmarks=c.benchmarks||{};c.benchmarks[bid]=c.benchmarks[bid]||[];
  c.benchmarks[bid].push({id:uid(),v:val,date:date||td()});
  sS();cm();vClient(cid);toast('Benchmark salvato! 📊','#EB750E')
}
function delCli(cid){

      </div>
      ${gcli.map(c=>`<div class="scr">
        <div class="scn">👤 ${esc(c.name)}</div>
        <div class="sins">

      </div>
      <button class="btn" style="background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.3)" onclick="swTab('sessioni')">✕ Annulla</button>

      <button class="btn ba" style="font-size:14px;padding:12px 22px" onclick="saveSes(${di})">💾 Salva sessione</button>

function saveSes(di){
  const g=G(),day=g.days[di],gcli=gGCli();
  const clientData={};
  day.exercises.forEach((ex,ei)=>{
    clientData[ex.id]=gcli.map(c=>({
      clientId:c.id,
      kg:document.getElementById(`s-${ei}-${c.id}-kg`)?.value||'',
      reps:document.getElementById(`s-${ei}-${c.id}-reps`)?.value||'',
      note:document.getElementById(`s-${ei}-${c.id}-note`)?.value||''
    })).filter(r=>r.kg||r.reps||r.note);
    gcli.forEach(c=>{
      const kg=document.getElementById(`s-${ei}-${c.id}-kg`)?.value;
      const reps=document.getElementById(`s-${ei}-${c.id}-reps`)?.value;
      if(kg||reps){ex.logs=ex.logs||[];ex.logs.push({id:uid(),date:td(),weight:kg,repsActual:reps,note:document.getElementById(`s-${ei}-${c.id}-note`)?.value||''})}
    });
  });
  g.sessions=g.sessions||[];
  g.sessions.push({id:uid(),date:td(),dayName:day.name,exercises:JSON.parse(JSON.stringify(day.exercises)),clientData});
  sS();CT='sessioni';rGrp();toast('Sessione salvata! 💾','#1a7a4a')
}

function togSes(i){const b=document.getElementById(`sb-${i}`),c=document.getElementById(`sc-${i}`);const o=b.style.display!=='none';b.style.display=o?'none':'block';c.textContent=o?'▼':'▲'}

    ${unasgn.map(c=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--wh);border:1px solid var(--br);border-radius:var(--r);margin-bottom:7px;opacity:.75">

function remCli(id){const g=G();g.clients=(g.clients||[]).filter(i=>i!==id);sS();rTab();rNav()}
function gGCli(){const g=G();if(!g)return[];return(g.clients||[]).map(id=>(S.clients||[]).find(c=>c.id===id)).filter(Boolean)}

function togArch(i){const b=document.getElementById(`ab-${i}`),c=document.getElementById(`ac-${i}`);const o=b.style.display!=='none';b.style.display=o?'none':'block';c.textContent=o?'▼':'▲'}

// CHART
function rChart(data,W=220,H=60,color='#014462'){
  const vals=data.filter(d=>!isNaN(d.value));if(vals.length<2)return'';
  const maxY=Math.max(...vals.map(v=>v.value)),minY=Math.min(...vals.map(v=>v.value));
  const pad=8;
  const px=i=>pad+(i/(vals.length-1))*(W-2*pad);
  const py=v=>H-pad-((v-minY)/(maxY-minY||1))*(H-2*pad);
  const pts=vals.map((v,i)=>`${px(i)},${py(v.value)}`).join(' ');
  const area=`${px(vals.length-1)},${H-pad} ${px(0)},${H-pad}`;
  const gid=`g${Math.random().toString(36).slice(2,6)}`;
  return`<div class="cw">
    <svg width="${W}" height="${H}" style="display:block;overflow:visible">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon fill="url(#${gid})" points="${pts} ${area}"/>
      <polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" points="${pts}"/>
      ${vals.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v.value)}" r="3.5" fill="${color}" stroke="white" stroke-width="1.5"/>`).join('')}
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#bbb;margin-top:2px">
      <span>${vals[0].date}</span><span style="font-weight:700;color:${color}">${vals[vals.length-1].value}</span><span>${vals[vals.length-1].date}</span>
    </div>
  </div>`
}

// BACKUP
function expD(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`dml-${td()}.json`;a.click();URL.revokeObjectURL(url);toast('Esportato! 📤')
}
function impD(event){
  const file=event.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const p=JSON.parse(e.target.result);if(!p.groups)throw 0;
      if(!confirm(`Importare? ${p.groups.length} gruppi, ${(p.clients||[]).length} clienti.`))return;
      S=p;sS();CG=null;xD.clear();xE.clear();rNav();vDash();toast('Ripristinato! ✅')
    }catch{toast('File non valido.','#c0392b')}
  };
  r.readAsText(file);event.target.value='';
}

vDash();
