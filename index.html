<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="dr. Mattia Lantero">
<title>dr. Mattia Lantero</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:   #014462;
  --accent:    #EB750E;
  --dark:      #1E1E1E;
  --mid:       #AEADAD;
  --light:     #F8F8F8;
  --white:     #ffffff;
  --border:    #e0e0e0;
  --primary-light: #e8f2f7;
  --accent-light:  #fdf0e6;
  --danger:    #c0392b;
  --danger-light: #fdf2f2;
  --success:   #1a7a4a;
  --radius:    10px;
  --radius-sm: 7px;
  --shadow:    0 1px 4px rgba(1,68,98,0.08);
  --shadow-md: 0 4px 18px rgba(1,68,98,0.13);
  --shadow-lg: 0 16px 48px rgba(1,68,98,0.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
font-family: ‘Lato’, sans-serif;
background: var(–light);
color: var(–dark);
height: 100vh;
overflow: hidden;
display: flex;
flex-direction: column;
}

/* ── HEADER MOBILE ── */
#mobile-header {
display: none;
align-items: center;
gap: 12px;
padding: 0 16px;
height: 56px;
background: var(–primary);
flex-shrink: 0;
z-index: 40;
}
#menu-toggle {
background: none; border: none; color: var(–white);
font-size: 22px; cursor: pointer; padding: 4px;
}
.mobile-logo { display: flex; align-items: center; gap: 10px; }
.mobile-logo-text { color: var(–white); font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
.mobile-logo-sub { color: rgba(255,255,255,0.6); font-size: 10px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; }

/* ── BODY WRAP ── */
#body-wrap { display: flex; flex: 1; overflow: hidden; }

/* ── SIDEBAR ── */
#sidebar {
width: 260px; min-width: 260px;
background: var(–primary);
display: flex; flex-direction: column;
height: 100%; overflow-y: auto;
transition: transform 0.3s ease;
}
.sidebar-logo {
padding: 28px 22px 20px;
border-bottom: 1px solid rgba(255,255,255,0.1);
display: flex; align-items: center; gap: 14px;
}
.sidebar-logo-text { flex: 1; }
.sidebar-logo-name {
color: var(–white); font-size: 17px; font-weight: 900;
letter-spacing: -0.2px; line-height: 1.2;
}
.sidebar-logo-name span { color: var(–accent); }
.sidebar-logo-sub {
color: rgba(255,255,255,0.5); font-size: 9px;
font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 3px;
}

/* SVG LOGO */
.logo-svg { width: 44px; height: 44px; flex-shrink: 0; }

.nav-section {
font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.4);
letter-spacing: 0.12em; padding: 18px 22px 6px; text-transform: uppercase;
}
.nav-item {
display: flex; align-items: center; gap: 10px;
padding: 10px 14px; margin: 2px 10px;
border-radius: var(–radius-sm); border: none;
background: none; cursor: pointer; text-align: left;
color: rgba(255,255,255,0.75); font-size: 14px;
font-family: ‘Lato’, sans-serif; font-weight: 400;
width: calc(100% - 20px); transition: all 0.15s;
}
.nav-item:hover { background: rgba(255,255,255,0.08); color: var(–white); }
.nav-item.active { background: var(–accent); color: var(–white); font-weight: 700; }
.nav-item .nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-item .nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.nav-item .nav-badge {
background: rgba(255,255,255,0.2); color: var(–white);
font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 700;
}
.nav-item.active .nav-badge { background: rgba(255,255,255,0.3); }

.add-btn {
margin: 6px 18px 0; padding: 10px 14px;
border-radius: var(–radius-sm);
border: 1.5px dashed rgba(255,255,255,0.25);
background: none; color: rgba(255,255,255,0.5);
cursor: pointer; font-size: 13px; font-family: ‘Lato’, sans-serif;
text-align: center; transition: all 0.15s;
}
.add-btn:hover { border-color: var(–accent); color: var(–accent); }

.sidebar-footer {
margin-top: auto; padding: 16px 18px;
border-top: 1px solid rgba(255,255,255,0.1);
}
.backup-btn {
display: block; width: 100%; padding: 9px 12px;
border-radius: var(–radius-sm); border: 1px solid rgba(255,255,255,0.15);
background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.65);
cursor: pointer; font-size: 12px; font-family: ‘Lato’, sans-serif;
font-weight: 700; transition: all 0.15s; text-align: center; margin-bottom: 6px;
}
.backup-btn:hover { background: rgba(255,255,255,0.12); color: var(–white); }
.backup-label { font-size: 9px; color: rgba(255,255,255,0.3); text-align: center; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 8px; }

/* ── MAIN ── */
#main { flex: 1; overflow-y: auto; background: var(–light); }
.page { padding: 32px 36px; max-width: 940px; }

/* ── PAGE HEADER ── */
.page-eyebrow { font-size: 10px; font-weight: 700; color: var(–accent); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }
.page-title { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; color: var(–dark); margin-bottom: 4px; }
.page-title span { color: var(–accent); }
.page-sub { font-size: 14px; color: var(–mid); margin-bottom: 28px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }

/* ── STATS ── */
.stats-row { display: flex; gap: 14px; margin-bottom: 32px; flex-wrap: wrap; }
.stat-card {
background: var(–white); border: 1px solid var(–border);
border-radius: var(–radius); padding: 20px 22px; flex: 1; min-width: 120px;
box-shadow: var(–shadow); position: relative; overflow: hidden;
}
.stat-card::before {
content: ‘’; position: absolute; top: 0; left: 0; right: 0; height: 3px;
background: var(–primary);
}
.stat-card.orange::before { background: var(–accent); }
.stat-card.dark::before { background: var(–dark); }
.stat-icon { font-size: 20px; margin-bottom: 10px; }
.stat-value { font-size: 36px; font-weight: 900; color: var(–primary); line-height: 1; }
.stat-card.orange .stat-value { color: var(–accent); }
.stat-card.dark .stat-value { color: var(–dark); }
.stat-label { font-size: 11px; color: var(–mid); margin-top: 4px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

/* ── GROUP CARDS ── */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.group-card {
background: var(–white); border: 1px solid var(–border);
border-radius: var(–radius); padding: 20px; cursor: pointer;
transition: box-shadow 0.2s, transform 0.15s; box-shadow: var(–shadow);
position: relative; overflow: hidden;
}
.group-card::after {
content: ‘’; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
background: var(–primary); transform: scaleX(0); transition: transform 0.2s;
}
.group-card:hover { box-shadow: var(–shadow-md); transform: translateY(-2px); }
.group-card:hover::after { transform: scaleX(1); }
.group-card-type {
font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
color: var(–accent); margin-bottom: 8px;
}
.group-card-name { font-weight: 900; font-size: 16px; margin-bottom: 6px; color: var(–dark); }
.group-card-meta { font-size: 12px; color: var(–mid); margin-top: 3px; }
.group-card-days {
display: inline-flex; align-items: center; gap: 4px;
margin-top: 10px; padding: 3px 8px;
background: var(–primary-light); color: var(–primary);
border-radius: 20px; font-size: 11px; font-weight: 700;
}

/* ── TABS ── */
.tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid var(–border); }
.tab {
padding: 10px 18px; border: none; background: none; cursor: pointer;
font-size: 13px; font-family: ‘Lato’, sans-serif; color: var(–mid);
border-bottom: 2px solid transparent; margin-bottom: -2px;
transition: color 0.15s; font-weight: 700; letter-spacing: 0.02em;
text-transform: uppercase; font-size: 11px;
}
.tab:hover { color: var(–dark); }
.tab.active { color: var(–primary); border-bottom: 2px solid var(–primary); }

/* ── SCHEDA EDITOR ── */
.scheda-meta { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
.scheda-meta .field { flex: 1; min-width: 150px; }

.day-block {
background: var(–white); border: 1px solid var(–border);
border-radius: var(–radius); margin-bottom: 12px;
overflow: hidden; box-shadow: var(–shadow);
}
.day-header {
display: flex; align-items: center; justify-content: space-between;
padding: 14px 18px; cursor: pointer; user-select: none;
border-left: 4px solid var(–primary);
}
.day-header:hover { background: #fafafa; }
.day-name-input {
font-weight: 900; font-size: 15px; border: none; outline: none;
background: transparent; cursor: text; font-family: ‘Lato’, sans-serif;
color: var(–dark); width: 180px;
}
.day-body { padding: 10px 14px 16px; background: #f9fafc; border-top: 1px solid var(–border); }

.ex-block {
background: var(–white); border: 1px solid var(–border);
border-radius: var(–radius-sm); margin-bottom: 8px; overflow: hidden;
}
.ex-header {
display: flex; align-items: center; justify-content: space-between;
padding: 11px 14px; cursor: pointer; user-select: none;
}
.ex-header:hover { background: #fafafa; }
.ex-body { padding: 14px 16px; border-top: 1px solid var(–border); background: #fdfdfd; }
.ex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ex-grid .span2 { grid-column: 1 / -1; }

/* CLIENT WEIGHTS inside exercise */
.client-weights { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(–border); }
.client-weight-row {
display: flex; align-items: center; gap: 10px;
padding: 7px 0; border-bottom: 1px solid #f0f0f0;
}
.client-weight-row:last-child { border-bottom: none; }
.client-weight-name { font-weight: 700; font-size: 13px; flex: 1; color: var(–dark); }
.client-weight-inputs { display: flex; gap: 8px; align-items: center; }
.client-weight-inputs input {
width: 70px; padding: 5px 8px; font-size: 13px;
border: 1px solid var(–border); border-radius: 6px;
font-family: ‘Lato’, sans-serif; text-align: center;
}
.client-weight-unit { font-size: 11px; color: var(–mid); font-weight: 700; }

/* ── LOGS ── */
.logs-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(–border); }
.log-list { margin-top: 8px; }
.log-row {
display: flex; gap: 10px; align-items: center; font-size: 13px;
padding: 5px 0; border-bottom: 1px solid #f5f5f5; flex-wrap: wrap;
}
.log-row:last-child { border-bottom: none; }

/* ── CHARTS ── */
.charts-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
.chart-wrap { }
.chart-label { font-size: 10px; font-weight: 700; color: var(–mid); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.chart-dates { display: flex; justify-content: space-between; font-size: 10px; color: #bbb; margin-top: 3px; }

/* ── CLIENTI ── */
.client-row {
display: flex; align-items: center; justify-content: space-between;
padding: 13px 16px; background: var(–white); border: 1px solid var(–border);
border-radius: var(–radius); margin-bottom: 8px; box-shadow: var(–shadow);
}
.client-name { font-weight: 700; font-size: 14px; }
.client-date { font-size: 12px; color: var(–mid); margin-top: 2px; }
.client-groups { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
.client-group-tag {
font-size: 10px; font-weight: 700; background: var(–primary-light);
color: var(–primary); padding: 2px 8px; border-radius: 20px;
}

/* ── STORICO ── */
.archive-card {
background: var(–white); border: 1px solid var(–border);
border-radius: var(–radius); margin-bottom: 12px; overflow: hidden; box-shadow: var(–shadow);
}
.archive-header {
display: flex; align-items: center; justify-content: space-between;
padding: 14px 18px; cursor: pointer; border-left: 4px solid var(–mid);
}
.archive-header:hover { background: #fafafa; }
.archive-body { padding: 14px 18px; border-top: 1px solid var(–border); background: #fafafa; }
.archive-day-title {
font-weight: 700; font-size: 11px; color: var(–mid); margin-bottom: 6px;
margin-top: 10px; text-transform: uppercase; letter-spacing: 0.08em;
}
.archive-ex { font-size: 13px; color: var(–dark); padding: 3px 0 3px 12px; display: flex; align-items: center; gap: 6px; }

/* ── FORM ── */
.field-label { font-size: 10px; font-weight: 700; color: var(–mid); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
input[type=text], input[type=number], input[type=date], select, textarea {
width: 100%; padding: 9px 11px; border: 1.5px solid var(–border);
border-radius: var(–radius-sm); font-size: 14px;
font-family: ‘Lato’, sans-serif; outline: none;
background: var(–white); color: var(–dark); transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus {
border-color: var(–primary);
box-shadow: 0 0 0 3px rgba(1,68,98,0.08);
}
textarea { resize: vertical; min-height: 60px; }

/* ── BUTTONS ── */
.btn {
padding: 10px 20px; border-radius: var(–radius-sm); border: none;
cursor: pointer; font-size: 13px; font-family: ‘Lato’, sans-serif;
font-weight: 700; transition: all 0.15s; letter-spacing: 0.02em;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(–primary); color: var(–white); }
.btn-primary:hover { background: #013652; }
.btn-accent { background: var(–accent); color: var(–white); }
.btn-accent:hover { background: #d4690c; }
.btn-ghost { background: transparent; color: var(–mid); border: 1.5px solid var(–border); }
.btn-danger { background: var(–danger-light); color: var(–danger); border: 1px solid #f5c6c6; font-size: 12px; padding: 8px 14px; }
.btn-add {
background: var(–primary-light); color: var(–primary);
border: 1.5px dashed #a8c8d8; padding: 10px 16px;
border-radius: var(–radius-sm); cursor: pointer; font-size: 12px;
font-weight: 700; font-family: ‘Lato’, sans-serif; letter-spacing: 0.03em;
text-transform: uppercase; transition: all 0.15s;
}
.btn-add:hover { background: #d0e8f2; border-color: var(–primary); }
.btn-icon {
padding: 6px 10px; background: var(–primary-light); color: var(–primary);
border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.15s;
}
.btn-icon:hover { background: #c0daea; }
.btn-icon-accent {
padding: 6px 10px; background: var(–accent-light); color: var(–accent);
border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
}
.btn-icon-danger {
padding: 6px 10px; background: var(–danger-light); color: var(–danger);
border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
}

/* ── BADGES ── */
.badge { font-size: 10px; background: var(–primary-light); color: var(–primary); padding: 3px 9px; border-radius: 20px; font-weight: 700; white-space: nowrap; letter-spacing: 0.02em; }
.badge-orange { background: var(–accent-light); color: var(–accent); }
.badge-success { background: #d4edda; color: var(–success); }
.badge-mid { background: #f0f0f0; color: var(–mid); }

/* ── CAT DOTS ── */
.cat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cat-forza      { background: var(–primary); }
.cat-cardio     { background: var(–accent); }
.cat-mobilita   { background: #1a7a4a; }
.cat-ipertrofia { background: #6c3483; }
.cat-potenza    { background: #c0392b; }
.cat-core       { background: var(–mid); }
.cat-stretching { background: #17a589; }

/* ── TYPE BUTTONS ── */
.type-btn {
padding: 9px 16px; border: 1.5px solid var(–border); border-radius: var(–radius-sm);
cursor: pointer; background: var(–white); font-size: 13px;
font-family: ‘Lato’, sans-serif; font-weight: 700; transition: all 0.15s;
}
.type-btn.active { border-color: var(–primary); background: var(–primary-light); color: var(–primary); }

/* ── MODAL ── */
.overlay {
position: fixed; inset: 0; background: rgba(1,68,98,0.4);
display: flex; align-items: center; justify-content: center;
z-index: 100; padding: 16px; backdrop-filter: blur(3px);
}
.modal-box {
background: var(–white); border-radius: 14px; padding: 28px;
width: 100%; max-width: 480px; box-shadow: var(–shadow-lg);
max-height: 90vh; overflow-y: auto;
}
.modal-title { font-size: 18px; font-weight: 900; margin-bottom: 20px; color: var(–dark); }
.modal-title span { color: var(–accent); }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }

/* ── TOAST ── */
#toast {
position: fixed; bottom: 24px; right: 24px;
padding: 12px 20px; border-radius: var(–radius);
color: var(–white); font-weight: 700; font-size: 13px;
z-index: 200; box-shadow: var(–shadow-md); display: none;
animation: slideUp 0.3s ease; letter-spacing: 0.02em;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ── EMPTY ── */
.empty { color: var(–mid); font-size: 14px; padding: 48px 0; text-align: center; }
.empty-icon { font-size: 36px; margin-bottom: 12px; }

/* ── DIVIDER ── */
.section-divider {
display: flex; align-items: center; gap: 12px; margin: 20px 0 16px;
}
.section-divider span { font-size: 10px; font-weight: 700; color: var(–mid); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
.section-divider::before, .section-divider::after { content: ‘’; flex: 1; height: 1px; background: var(–border); }

/* ── INLINE EDIT ── */
.inline-input {
padding: 6px 10px; border: 1.5px solid var(–border); border-radius: var(–radius-sm);
font-size: 20px; font-weight: 900; font-family: ‘Lato’, sans-serif; outline: none;
}
.inline-input:focus { border-color: var(–primary); }

/* ── MOBILE OVERLAY ── */
#mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 49; }
#mobile-overlay.open { display: block; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
#mobile-header { display: flex; }
#sidebar {
position: fixed; left: 0; top: 56px; height: calc(100vh - 56px);
z-index: 50; transform: translateX(-100%);
}
#sidebar.open { transform: translateX(0); box-shadow: var(–shadow-lg); }
.page { padding: 20px 16px; }
.page-title { font-size: 22px; }
.stats-row { gap: 10px; }
.stat-card { padding: 14px 16px; }
.stat-value { font-size: 28px; }
.ex-grid { grid-template-columns: 1fr; }
.ex-grid .span2 { grid-column: 1; }
.scheda-meta { flex-direction: column; }
.card-grid { grid-template-columns: 1fr 1fr; }
.client-weight-inputs input { width: 60px; }
}
@media (max-width: 400px) {
.card-grid { grid-template-columns: 1fr; }
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
</style>

</head>
<body>

<div id="mobile-overlay" onclick="closeSidebar()"></div>

<!-- MOBILE HEADER -->

<div id="mobile-header">
  <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="mobile-logo">
    <svg class="logo-svg" style="width:32px;height:32px" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" stroke="white" stroke-width="3" fill="none"/>
      <ellipse cx="50" cy="28" rx="10" ry="10" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M50 38 C50 38 42 48 40 62 C38 72 44 78 50 80 C56 78 62 72 60 62 C58 48 50 38 50 38Z" stroke="white" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <path d="M50 48 C50 48 38 44 32 50 C28 54 30 62 36 64" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M50 48 C50 48 62 44 68 50 C72 54 70 62 64 64" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="mobile-logo-text"><span style="color:#EB750E">dr.</span> Mattia Lantero</div>
      <div class="mobile-logo-sub">Chinesiologo</div>
    </div>
  </div>
</div>

<div id="body-wrap">

<!-- SIDEBAR -->

<aside id="sidebar">
  <div class="sidebar-logo">
    <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" fill="none"/>
      <ellipse cx="50" cy="27" rx="9" ry="9" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M50 36 C50 36 42 47 40 61 C38 71 44 78 50 80 C56 78 62 71 60 61 C58 47 50 36 50 36Z" stroke="white" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <path d="M50 47 C50 47 38 43 32 50 C28 55 31 63 37 65" stroke="#EB750E" stroke-width="2.5" fill="none" stroke-linecap="round"/>

<script>
// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
const STORAGE_KEY = 'dml_trainer_v3';
let state = loadState();
let currentView = 'dashboard';
let currentGroupId = null;
let currentTab = 'scheda';
let expandedDays = new Set();
let expandedExs = new Set();

function loadState() {
  try {
    const r = localStorage.getItem(STORAGE_KEY);
    return r ? JSON.parse(r) : { groups: [], clients: [] };
  } catch { return { groups: [], clients: [] }; }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('it-IT') : '—';
const getGroup = () => state.groups.find(g => g.id === currentGroupId);
const catClass = cat => ({ forza:'cat-forza', cardio:'cat-cardio', mobilità:'cat-mobilita', ipertrofia:'cat-ipertrofia', potenza:'cat-potenza', core:'cat-core', stretching:'cat-stretching' }[cat] || 'cat-forza');
const typeLabel = t => ({ group:'Small Group', single:'Singolo', couple:'Coppia' }[t] || t);
const escHtml = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg, color = '#014462') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 2800);
}

// ════════════════════════════════════════════════════════════
// SIDEBAR
// ════════════════════════════════════════════════════════════
function renderNav() {
  const container = document.getElementById('nav-groups');
  container.innerHTML = state.groups.map(g => `
    <button class="nav-item ${currentGroupId === g.id && currentView === 'group' ? 'active' : ''}"
      onclick="showGroup('${g.id}')">
      <span class="nav-icon">${g.type === 'group' ? '👥' : g.type === 'couple' ? '👫' : '👤'}</span>
      <span class="nav-label">${escHtml(g.name)}</span>
      ${g.clients?.length ? `<span class="nav-badge">${g.clients.length}</span>` : ''}
    </button>
  `).join('');
  document.getElementById('nav-dashboard').className = 'nav-item' + (currentView === 'dashboard' ? ' active' : '');
  document.getElementById('nav-clienti').className = 'nav-item' + (currentView === 'clienti' ? ' active' : '');
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mobile-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobile-overlay').classList.remove('open');
}

// ════════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════════
function showDashboard() {
  currentView = 'dashboard'; currentGroupId = null;
  renderNav(); closeSidebar();
  const groups = state.groups;
  const clients = state.clients || [];
  const totalSchede = groups.reduce((s, g) => s + (g.days?.length > 0 ? 1 : 0) + (g.archivedSchede?.length || 0), 0);
  document.getElementById('content').innerHTML = `
    <div class="page">
      <div class="page-eyebrow">Pannello di controllo</div>
      <h1 class="page-title"><span>dr.</span> Mattia Lantero</h1>
      <div class="page-sub">Gestione schede allenamento — Chinesiologo</div>
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-value">${groups.length}</div>
          <div class="stat-label">Gruppi attivi</div>
        </div>
        <div class="stat-card orange">
          <div class="stat-icon">👤</div>
          <div class="stat-value">${clients.length}</div>
          <div class="stat-label">Clienti totali</div>
        </div>
        <div class="stat-card dark">
          <div class="stat-icon">📋</div>
          <div class="stat-value">${totalSchede}</div>
          <div class="stat-label">Schede create</div>
        </div>
      </div>
      ${groups.length === 0 ? `<div class="empty"><div class="empty-icon">💪</div>Nessun gruppo ancora.<br>Clicca <strong>"+ Nuovo gruppo"</strong> per iniziare!</div>` : `
      <div class="section-divider"><span>Gruppi & Sessioni</span></div>
      <div class="card-grid">
        ${groups.map(g => {
          const clientNames = (g.clients||[]).map(id => {
            const c = (state.clients||[]).find(x => x.id === id);
            return c ? c.name : null;
          }).filter(Boolean);
          return `
          <div class="group-card" onclick="showGroup('${g.id}')">
            <div class="group-card-type">${typeLabel(g.type)}</div>
            <div class="group-card-name">${escHtml(g.name)}</div>
            <div class="group-card-meta">${clientNames.length > 0 ? clientNames.slice(0,3).join(', ') + (clientNames.length > 3 ? ` +${clientNames.length-3}` : '') : 'Nessun cliente'}</div>
            <div style="margin-top:8px">
              ${g.days?.length > 0 ? `<span class="group-card-days">📋 ${g.days.length} giorni</span>` : `<span class="badge badge-mid">Nessuna scheda</span>`}
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>`;
}

// ════════════════════════════════════════════════════════════
// CLIENTI VIEW (archivio centrale)
// ════════════════════════════════════════════════════════════
function showClientiView() {
  currentView = 'clienti'; currentGroupId = null;
  renderNav(); closeSidebar();
  renderClientiPage();
}

function renderClientiPage() {
  const clients = state.clients || [];
  document.getElementById('content').innerHTML = `
    <div class="page">
      <div class="page-eyebrow">Archivio</div>
      <h1 class="page-title">Clienti</h1>
      <div class="page-sub">Gestisci tutti i tuoi clienti in un unico posto</div>
      <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap">
        <input type="text" id="new-client-name" placeholder="Nome cliente" style="max-width:260px;flex:1" onkeydown="if(event.key==='Enter')addClientGlobal()">
        <button class="btn btn-primary" onclick="addClientGlobal()">+ Aggiungi cliente</button>
      </div>
      ${clients.length === 0 ? `<div class="empty"><div class="empty-icon">👤</div>Nessun cliente. Aggiungine uno!</div>` :
        clients.map(c => {
          const groups = state.groups.filter(g => g.clients?.includes(c.id));
          return `
          <div class="client-row">
            <div>
              <div class="client-name">${escHtml(c.name)}</div>
              <div class="client-date">Dal ${fmtDate(c.joinDate)}</div>
              ${groups.length > 0 ? `<div class="client-groups">${groups.map(g => `<span class="client-group-tag">${escHtml(g.name)}</span>`).join('')}</div>` : `<div style="font-size:11px;color:var(--mid);margin-top:4px">Nessun gruppo assegnato</div>`}
            </div>
            <div style="display:flex;gap:6px">
              <button class="btn-icon-danger" onclick="deleteClientGlobal('${c.id}')">🗑</button>
            </div>
          </div>`;
        }).join('')}
    </div>`;
}

function addClientGlobal() {
  const input = document.getElementById('new-client-name');
  if (!input?.value?.trim()) return;
  state.clients = state.clients || [];
  state.clients.push({ id: uid(), name: input.value.trim(), joinDate: today() });
  saveState(); renderClientiPage(); renderNav();
  showToast('Cliente aggiunto! 👤');
}
function deleteClientGlobal(id) {
  if (!confirm('Eliminare questo cliente? Verrà rimosso da tutti i gruppi.')) return;
  state.clients = (state.clients||[]).filter(c => c.id !== id);
  state.groups.forEach(g => { g.clients = (g.clients||[]).filter(cid => cid !== id); });
  saveState(); renderClientiPage(); renderNav();
}

// ════════════════════════════════════════════════════════════
// GROUP VIEW
// ════════════════════════════════════════════════════════════
function showGroup(gid) {
  currentView = 'group'; currentGroupId = gid;
  renderNav(); closeSidebar(); renderGroup();
}

function renderGroup() {
  const g = getGroup(); if (!g) return;
  const tabs = [['scheda','📋 Scheda'],['clienti','👥 Clienti'],['storico','🗂 Storico']];
  document.getElementById('content').innerHTML = `
    <div class="page">
      <div class="page-header">
        <div>
          <div class="page-eyebrow">${typeLabel(g.type)}</div>
          <h1 class="page-title" id="group-title" style="cursor:pointer" onclick="editGroupName()" title="Clicca per rinominare">
            ${escHtml(g.name)} <span style="font-size:16px;color:var(--mid)">✏️</span>
          </h1>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          ${g.days?.length > 0 ? `<button class="btn btn-danger" onclick="archiveScheda()">Archivia scheda</button>` : ''}
          <button class="btn-icon-danger" style="padding:8px 12px;font-size:12px;border-radius:8px;font-family:Lato,sans-serif;font-weight:700" onclick="deleteGroup('${g.id}')">🗑 Elimina</button>
        </div>
      </div>
      <div class="tabs">
        ${tabs.map(([k,l]) => `<button class="tab ${currentTab===k?'active':''}" onclick="switchTab('${k}')">${l}</button>`).join('')}
      </div>
      <div id="tab-content"></div>
    </div>`;
  renderTab();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    const key = t.textContent.includes('📋') ? 'scheda' : t.textContent.includes('👥') ? 'clienti' : 'storico';
    t.className = 'tab' + (key === tab ? ' active' : '');
  });
  renderTab();
}

function renderTab() {
  const tc = document.getElementById('tab-content');
  if (!tc) return;
  if (currentTab === 'scheda') tc.innerHTML = renderSchedaEditor();
  else if (currentTab === 'clienti') tc.innerHTML = renderGroupClienti();
  else if (currentTab === 'storico') tc.innerHTML = renderStorico();
  // No attachSchedaEvents needed — using inline handlers
}

// ════════════════════════════════════════════════════════════
// SCHEDA EDITOR
// ════════════════════════════════════════════════════════════
function renderSchedaEditor() {
  const g = getGroup();
  const days = g.days || [];
  return `
    <div class="scheda-meta">
      <div class="field">
        <div class="field-label">Nome scheda</div>
        <input type="text" value="${escHtml(g.currentSchedaName||'')}" placeholder="es. Forza Base — Marzo 2026" oninput="updateSchedaMeta('currentSchedaName',this.value)">
      </div>
      <div class="field">
        <div class="field-label">Data inizio</div>
        <input type="date" value="${g.schedaStartDate||today()}" oninput="updateSchedaMeta('schedaStartDate',this.value)">
      </div>
    </div>
    ${days.length === 0 ? `<div class="empty"><div class="empty-icon">📋</div>Nessun giorno. Aggiungine uno!</div>` : ''}
    <div id="days-container">
      ${days.map((day,di) => renderDay(day,di)).join('')}
    </div>
    <button class="btn btn-primary" style="margin-top:8px" onclick="addDay()">+ Aggiungi Giorno</button>`;
}

function renderDay(day, di) {
  const open = expandedDays.has(di);
  return `
    <div class="day-block" id="day-${di}">
      <div class="day-header" onclick="toggleDay(${di})">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:11px;color:var(--mid)">${open?'▼':'▶'}</span>
          <input class="day-name-input" value="${escHtml(day.name)}" onclick="event.stopPropagation()" oninput="updateDayName(${di},this.value)">
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="badge">${day.exercises.length} esercizi</span>
          <button class="btn-icon-danger" onclick="event.stopPropagation();deleteDay(${di})">🗑</button>
        </div>
      </div>
      ${open ? `<div class="day-body">
        ${day.exercises.map((ex,ei) => renderExercise(ex,di,ei)).join('')}
        <button class="btn-add" onclick="addExercise(${di})">+ Aggiungi esercizio</button>
      </div>` : ''}
    </div>`;
}

function renderExercise(ex, di, ei) {
  const key = `${di}-${ei}`;
  const open = expandedExs.has(key);
  const logs = ex.logs || [];
  const clientWeights = ex.clientWeights || {};
  const groupClients = getGroupClientNames();
  return `
    <div class="ex-block" id="ex-${di}-${ei}">
      <div class="ex-header" onclick="toggleEx('${key}')">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;color:var(--mid)">${open?'▼':'▶'}</span>
          <span class="cat-dot ${catClass(ex.category)}"></span>
          <span style="font-weight:700;font-size:14px">${escHtml(ex.name)}</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${ex.sets ? `<span class="badge">${escHtml(ex.sets)}×${escHtml(ex.reps||'')}</span>` : ''}
          ${logs.length > 0 ? `<span class="badge badge-success">${logs.length} sessioni</span>` : ''}
          <button class="btn-icon-accent" onclick="event.stopPropagation();openLogModal(${di},${ei})">📈</button>
          <button class="btn-icon-danger" onclick="event.stopPropagation();deleteExercise(${di},${ei})">🗑</button>
        </div>
      </div>
      ${open ? `
      <div class="ex-body">
        <div class="ex-grid">
          <div>
            <div class="field-label">Nome esercizio</div>
            <input type="text" value="${escHtml(ex.name)}" oninput="updateEx(${di},${ei},'name',this.value)">
          </div>
          <div>
            <div class="field-label">Categoria</div>
            <select onchange="updateEx(${di},${ei},'category',this.value)">
              ${['forza','cardio','mobilità','ipertrofia','potenza','core','stretching'].map(c=>`<option value="${c}"${ex.category===c?' selected':''}>${c.charAt(0).toUpperCase()+c.slice(1)}</option>`).join('')}
            </select>
          </div>
          <div>
            <div class="field-label">Serie</div>
            <input type="text" value="${escHtml(ex.sets||'')}" placeholder="es. 4" oninput="updateEx(${di},${ei},'sets',this.value)">
          </div>
          <div>
            <div class="field-label">Reps / Tempo</div>
            <input type="text" value="${escHtml(ex.reps||'')}" placeholder="es. 8-10 / 30s" oninput="updateEx(${di},${ei},'reps',this.value)">
          </div>
          <div>
            <div class="field-label">Recupero</div>
            <input type="text" value="${escHtml(ex.rest||'')}" placeholder="es. 90s" oninput="updateEx(${di},${ei},'rest',this.value)">
          </div>
          <div>
            <div class="field-label">Note</div>
            <input type="text" value="${escHtml(ex.notes||'')}" placeholder="es. focus sul controllo" oninput="updateEx(${di},${ei},'notes',this.value)">
          </div>
        </div>

        ${groupClients.length > 0 ? `
        <div class="client-weights">
          <div class="section-divider"><span>Pesi per cliente</span></div>
          ${groupClients.map(c => `
            <div class="client-weight-row">
              <div class="client-weight-name">👤 ${escHtml(c.name)}</div>
              <div class="client-weight-inputs">
                <input type="number" value="${escHtml(String((clientWeights[c.id]||{}).kg||''))}" placeholder="kg" title="Carico kg"
                  oninput="updateClientWeight(${di},${ei},'${c.id}','kg',this.value)">
                <span class="client-weight-unit">kg</span>
                <input type="number" value="${escHtml(String((clientWeights[c.id]||{}).reps||''))}" placeholder="reps"
                  oninput="updateClientWeight(${di},${ei},'${c.id}','reps',this.value)">
                <span class="client-weight-unit">reps</span>
              </div>
            </div>`).join('')}
        </div>` : `<div style="font-size:12px;color:var(--mid);margin-top:14px;padding:10px;background:var(--primary-light);border-radius:8px">
          👥 Aggiungi clienti al gruppo per registrare i pesi individuali</div>`}

        ${logs.length >= 2 ? `
        <div class="logs-section">
          <div class="section-divider"><span>Grafici progressi</span></div>
          <div class="charts-grid">
            ${logs.some(l=>l.weight) ? renderChart(logs,'weight','Carico (kg)','#014462') : ''}
            ${logs.some(l=>l.repsActual) ? renderChart(logs,'repsActual','Reps eseguite','#EB750E') : ''}
            ${logs.some(l=>l.duration) ? renderChart(logs,'duration','Durata (s)','#1a7a4a') : ''}
            ${logs.some(l=>l.distance) ? renderChart(logs,'distance','Distanza (m)','#6c3483') : ''}
          </div>
        </div>` : ''}

        ${logs.length > 0 ? `
        <div class="logs-section">
          <div class="section-divider"><span>Ultime sessioni</span></div>
          <div class="log-list">
            ${[...logs].reverse().slice(0,5).map(l=>`
              <div class="log-row">
                <span style="color:var(--mid);font-size:12px;min-width:72px">${fmtDate(l.date)}</span>
                ${l.weight?`<span>⚖️ <strong>${l.weight}</strong>kg</span>`:''}
                ${l.repsActual?`<span>🔁 <strong>${l.repsActual}</strong> reps</span>`:''}
                ${l.duration?`<span>⏱ <strong>${l.duration}</strong>s</span>`:''}
                ${l.distance?`<span>📏 <strong>${l.distance}</strong>m</span>`:''}
                ${l.note?`<span style="color:var(--mid);font-style:italic">"${escHtml(l.note)}"</span>`:''}
              </div>`).join('')}
          </div>
        </div>` : `<div style="color:var(--mid);font-size:12px;margin-top:14px;padding:10px;background:var(--accent-light);border-radius:8px;border-left:3px solid var(--accent)">
          📈 Nessuna sessione registrata. Clicca 📈 per registrare la prima!</div>`}
      </div>` : ''}
    </div>`;
}

function renderChart(logs, field, label, color) {
  const vals = logs.filter(l=>l[field]!==''&&l[field]!==undefined).map(l=>({x:l.date,y:Number(l[field])}));
  if (vals.length < 2) return '';
  const maxY = Math.max(...vals.map(v=>v.y)); const minY = Math.min(...vals.map(v=>v.y));
  const W=240, H=72, pad=10;
  const px = i => pad+(i/(vals.length-1))*(W-2*pad);
  const py = v => H-pad-((v-minY)/(maxY-minY||1))*(H-2*pad);
  const pts = vals.map((v,i)=>`${px(i)},${py(v.y)}`).join(' ');
  const area = `${px(vals.length-1)},${H-pad} ${px(0)},${H-pad}`;
  return `<div class="chart-wrap">
    <div class="chart-label">${label}</div>
    <svg width="${W}" height="${H}" style="display:block;overflow:visible">
      <defs><linearGradient id="g${field}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon fill="url(#g${field})" points="${pts} ${area}"/>
      <polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" points="${pts}"/>
      ${vals.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v.y)}" r="3.5" fill="${color}" stroke="white" stroke-width="1.5"/>`).join('')}
    </svg>
    <div class="chart-dates"><span>${vals[0].x}</span><span style="font-weight:700;color:${color}">${vals[vals.length-1].y}</span><span>${vals[vals.length-1].x}</span></div>
  </div>`;
}

// ════════════════════════════════════════════════════════════
// GROUP CLIENTI TAB
// ════════════════════════════════════════════════════════════
function renderGroupClienti() {
  const g = getGroup();
  const allClients = state.clients || [];
  const assigned = g.clients || [];
  const assignedClients = assigned.map(id => allClients.find(c => c.id === id)).filter(Boolean);
  const unassigned = allClients.filter(c => !assigned.includes(c.id));
  return `
    <div>
      <div style="margin-bottom:16px;font-size:13px;color:var(--mid)">
        Aggiungi clienti dall'archivio al gruppo. I pesi individuali si registrano nella scheda.
      </div>
      ${assignedClients.length === 0 ? `<div class="empty" style="padding:24px 0"><div class="empty-icon">👥</div>Nessun cliente in questo gruppo.</div>` :
        assignedClients.map(c => `
          <div class="client-row">
            <div>
              <div class="client-name">${escHtml(c.name)}</div>
              <div class="client-date">Aggiunto il ${fmtDate(c.joinDate)}</div>
            </div>
            <button class="btn-icon-danger" onclick="removeClientFromGroup('${c.id}')">Rimuovi</button>
          </div>`).join('')}
      ${unassigned.length > 0 ? `
        <div class="section-divider"><span>Aggiungi al gruppo</span></div>
        ${unassigned.map(c => `
          <div class="client-row" style="opacity:0.7">
            <div class="client-name">${escHtml(c.name)}</div>
            <button class="btn btn-primary" style="padding:7px 14px;font-size:12px" onclick="addClientToGroup('${c.id}')">+ Aggiungi</button>
          </div>`).join('')}` : ''}
      ${allClients.length === 0 ? `<div style="margin-top:16px;padding:14px;background:var(--primary-light);border-radius:8px;font-size:13px;color:var(--primary)">
        💡 Prima crea i clienti in <strong>Archivio Clienti</strong>, poi assegnali qui.</div>` : ''}
    </div>`;
}

function addClientToGroup(clientId) {
  const g = getGroup(); g.clients = g.clients || [];
  if (!g.clients.includes(clientId)) { g.clients.push(clientId); saveState(); renderTab(); renderNav(); showToast('Cliente aggiunto al gruppo!'); }
}
function removeClientFromGroup(clientId) {
  const g = getGroup(); g.clients = (g.clients||[]).filter(id => id !== clientId);
  saveState(); renderTab(); renderNav();
}

function getGroupClientNames() {
  const g = getGroup(); if (!g) return [];
  const allClients = state.clients || [];
  return (g.clients||[]).map(id => allClients.find(c=>c.id===id)).filter(Boolean);
}

// ════════════════════════════════════════════════════════════
// STORICO
// ════════════════════════════════════════════════════════════
function renderStorico() {
  const g = getGroup();
  const arch = g.archivedSchede || [];
  if (arch.length === 0) return `<div class="empty"><div class="empty-icon">🗂</div>Nessuna scheda archiviata ancora.<br>Usa <strong>"Archivia scheda"</strong> per salvare.</div>`;
  return arch.map((s,i) => `
    <div class="archive-card">
      <div class="archive-header" onclick="toggleArchive(${i})">
        <div>
          <div style="font-weight:900;font-size:15px">${escHtml(s.name||'Scheda senza nome')}</div>
          <div style="font-size:12px;color:var(--mid);margin-top:3px">${fmtDate(s.startDate)} → ${fmtDate(s.endDate)}</div>
        </div>
        <span id="arch-chev-${i}" style="color:var(--mid)">▼</span>
      </div>
      <div id="arch-body-${i}" class="archive-body" style="display:none">
        ${(s.days||[]).map(day=>`
          <div class="archive-day-title">${escHtml(day.name)}</div>
          ${day.exercises.map(ex=>`
            <div class="archive-ex">
              <span class="cat-dot ${catClass(ex.category)}"></span>
              <span>${escHtml(ex.name)}</span>
              ${ex.sets?`<span style="color:var(--mid);font-size:12px">— ${escHtml(ex.sets)}×${escHtml(ex.reps||'')}</span>`:''}
              ${ex.rest?`<span style="color:var(--mid);font-size:12px">(rec. ${escHtml(ex.rest)})</span>`:''}
            </div>`).join('')}`).join('')}
      </div>
    </div>`).join('');
}

// ════════════════════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════════════════════
function toggleDay(di) {
  if (expandedDays.has(di)) expandedDays.delete(di); else expandedDays.add(di);
  renderTab();
}
function toggleEx(key) {
  if (expandedExs.has(key)) expandedExs.delete(key); else expandedExs.add(key);
  renderTab();
}
function toggleArchive(i) {
  const body = document.getElementById(`arch-body-${i}`);
  const chev = document.getElementById(`arch-chev-${i}`);
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  chev.textContent = open ? '▼' : '▲';
}

function updateSchedaMeta(field, val) { const g=getGroup(); g[field]=val; saveState(); }
function updateDayName(di, val) { const g=getGroup(); g.days[di].name=val; saveState(); }
function updateEx(di, ei, field, val) { const g=getGroup(); g.days[di].exercises[ei][field]=val; saveState(); }
function updateClientWeight(di, ei, clientId, field, val) {
  const g=getGroup();
  g.days[di].exercises[ei].clientWeights = g.days[di].exercises[ei].clientWeights || {};
  g.days[di].exercises[ei].clientWeights[clientId] = g.days[di].exercises[ei].clientWeights[clientId] || {};
  g.days[di].exercises[ei].clientWeights[clientId][field] = val;
  saveState();
}

function addDay() {
  const g=getGroup(); g.days=g.days||[];
  const labels=['A','B','C','D','E','F'];
  const n=g.days.length;
  g.days.push({id:uid(), name:`Giorno ${labels[n]||n+1}`, exercises:[]});
  expandedDays.add(g.days.length-1);
  saveState(); renderTab(); showToast('Giorno aggiunto!');
}
function addExercise(di) {
  const g=getGroup();
  g.days[di].exercises.push({id:uid(),name:'Nuovo esercizio',category:'forza',sets:'',reps:'',rest:'',notes:'',logs:[],clientWeights:{}});
  expandedExs.add(`${di}-${g.days[di].exercises.length-1}`);
  saveState(); renderTab(); showToast('Esercizio aggiunto!');
}
function deleteDay(di) {
  if (!confirm('Eliminare questo giorno?')) return;
  const g=getGroup(); g.days.splice(di,1);
  expandedDays.clear(); expandedExs.clear();
  saveState(); renderTab(); showToast('Giorno eliminato.','#c0392b');
}
function deleteExercise(di,ei) {
  if (!confirm('Eliminare questo esercizio?')) return;
  const g=getGroup(); g.days[di].exercises.splice(ei,1);
  saveState(); renderTab(); showToast('Esercizio eliminato.','#c0392b');
}
function archiveScheda() {
  const g=getGroup();
  if (!g.days||g.days.length===0) { showToast('Nessuna scheda da archiviare!','#EB750E'); return; }
  if (!confirm(`Archiviare la scheda "${g.currentSchedaName||'senza nome'}" e iniziarne una nuova?`)) return;
  g.archivedSchede=g.archivedSchede||[];
  g.archivedSchede.push({id:uid(),name:g.currentSchedaName||'Scheda senza nome',startDate:g.schedaStartDate||today(),endDate:today(),days:JSON.parse(JSON.stringify(g.days))});
  g.days=[]; g.currentSchedaName=''; g.schedaStartDate=today();
  expandedDays.clear(); expandedExs.clear();
  saveState(); renderGroup(); showToast('Scheda archiviata! ✅');
}
function deleteGroup(id) {
  if (!confirm('Eliminare questo gruppo e tutti i dati?')) return;
  state.groups=state.groups.filter(g=>g.id!==id);
  currentGroupId=null; saveState(); showDashboard();
  showToast('Gruppo eliminato.','#c0392b');
}
function editGroupName() {
  const g=getGroup();
  const el=document.getElementById('group-title');
  el.outerHTML=`<div style="display:flex;align-items:center;gap:8px">
    <input class="inline-input" id="name-edit-input" value="${escHtml(g.name)}" onkeydown="if(event.key==='Enter')saveGroupName()">
    <button class="btn btn-primary" onclick="saveGroupName()">Salva</button>
  </div>`;
  document.getElementById('name-edit-input').focus();
}
function saveGroupName() {
  const val=document.getElementById('name-edit-input')?.value?.trim();
  if (!val) return;
  const g=getGroup(); g.name=val; saveState(); renderNav(); renderGroup();
}

// ════════════════════════════════════════════════════════════
// LOG MODAL
// ════════════════════════════════════════════════════════════
function openLogModal(di,ei) {
  const g=getGroup();
  const ex=g.days[di].exercises[ei];
  document.getElementById('modal-box').innerHTML=`
    <div class="modal-title">📈 Sessione — <span>${escHtml(ex.name)}</span></div>
    <div class="ex-grid">
      <div><div class="field-label">Carico (kg)</div><input type="number" id="log-weight" placeholder="es. 80"></div>
      <div><div class="field-label">Reps eseguite</div><input type="number" id="log-reps" placeholder="es. 10"></div>
      <div><div class="field-label">Durata (secondi)</div><input type="number" id="log-duration" placeholder="es. 30"></div>
      <div><div class="field-label">Distanza (m)</div><input type="number" id="log-distance" placeholder="es. 500"></div>
      <div class="span2"><div class="field-label">Data sessione</div><input type="date" id="log-date" value="${today()}"></div>
      <div class="span2"><div class="field-label">Note</div><input type="text" id="log-note" placeholder="es. ottima forma"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-accent" onclick="saveLog(${di},${ei})">Salva sessione</button>
      <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
    </div>`;
  document.getElementById('modal').style.display='flex';
}
function saveLog(di,ei) {
  const g=getGroup();
  const ex=g.days[di].exercises[ei];
  ex.logs=ex.logs||[];
  ex.logs.push({id:uid(),date:document.getElementById('log-date').value||today(),weight:document.getElementById('log-weight').value,repsActual:document.getElementById('log-reps').value,duration:document.getElementById('log-duration').value,distance:document.getElementById('log-distance').value,note:document.getElementById('log-note').value});
  saveState(); closeModal(); renderTab(); showToast('Progresso salvato! 📈','#EB750E');
}

// ════════════════════════════════════════════════════════════
// NEW GROUP MODAL
// ════════════════════════════════════════════════════════════
let newGroupType='group';
function openModal(type) {
  if (type==='newGroup') {
    newGroupType='group';
    document.getElementById('modal-box').innerHTML=`
      <div class="modal-title">Nuovo <span>gruppo</span></div>
      <div class="field-label" style="margin-bottom:6px">Tipo</div>
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        <button class="type-btn active" id="type-group" onclick="setGroupType('group')">👥 Small Group</button>
        <button class="type-btn" id="type-single" onclick="setGroupType('single')">👤 Singolo</button>
        <button class="type-btn" id="type-couple" onclick="setGroupType('couple')">👫 Coppia</button>
      </div>
      <div class="field-label">Nome</div>
      <input type="text" id="new-group-name" placeholder="es. Small Group Lunedì" style="margin-bottom:4px" onkeydown="if(event.key==='Enter')createGroup()">
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="createGroup()">Crea</button>
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
      </div>`;
    document.getElementById('modal').style.display='flex';
    setTimeout(()=>document.getElementById('new-group-name').focus(),100);
  }
}
function setGroupType(t) {
  newGroupType=t;
  ['group','single','couple'].forEach(k => {
    const el=document.getElementById(`type-${k}`);
    if (el) el.className='type-btn'+(k===t?' active':'');
  });
}
function createGroup() {
  const name=document.getElementById('new-group-name')?.value?.trim();
  if (!name) return;
  const g={id:uid(),name,type:newGroupType,days:[],archivedSchede:[],clients:[],currentSchedaName:'',schedaStartDate:today()};
  state.groups.push(g); saveState(); closeModal(); showGroup(g.id); renderNav();
  showToast('Gruppo creato! 💪');
}

function closeModal() { document.getElementById('modal').style.display='none'; }
function closeModalOutside(e) { if (e.target.id==='modal') closeModal(); }

// ════════════════════════════════════════════════════════════
// BACKUP
// ════════════════════════════════════════════════════════════
function exportData() {
  const json=JSON.stringify(state,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`dml-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('Backup esportato! 📤');
}
function importData(event) {
  const file=event.target.files[0]; if (!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try {
      const parsed=JSON.parse(e.target.result);
      if (!parsed.groups) throw new Error();
      if (!confirm(`Importare il backup? ${parsed.groups.length} gruppi, ${(parsed.clients||[]).length} clienti.\n\nI dati attuali verranno sostituiti.`)) return;
      state=parsed; saveState(); currentGroupId=null;
      expandedDays.clear(); expandedExs.clear();
      renderNav(); showDashboard();
      showToast('Dati ripristinati! ✅');
    } catch { showToast('File non valido.','#c0392b'); }
  };
  reader.readAsText(file); event.target.value='';
}

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
showDashboard();
</script>
